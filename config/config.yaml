# GameForge Configuration — Godot 版本
# 主配置文件

app:
  name: GameForge
  version: 0.4.0
  description: Godot 游戏研发全流程 AI Agent 工具链
  environment: ${GAMEFORGE_ENV:development}
  debug: ${GAMEFORGE_DEBUG:true}

# Server configuration
server:
  host: 0.0.0.0
  port: 8000
  workers: 4
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

# LLM Configuration - 多Provider架构
llm:
  default_model: mimo-v2.5-pro
  base_url: https://token-plan-cn.xiaomimimo.com/v1
  max_retries: 3
  base_retry_delay: 1.0
  max_retry_delay: 30.0
  circuit_breaker_threshold: 5
  circuit_breaker_recovery: 60.0
  cache:
    enabled: true
    ttl: 3600
  providers:
    mimo:
      base_url: https://token-plan-cn.xiaomimimo.com/v1
      api_key_env: MIMO_API_KEY
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
    zhipu:
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
    kimi:
      base_url: https://api.moonshot.cn/v1
      api_key_env: KIMI_API_KEY
    sensenova:
      base_url: https://token.sensenova.cn/v1
      api_key_env: SENSENOVA_API_KEY
  models:
    planner:
      provider: mimo
      model: mimo-v2.5-pro
      temperature: 0.4
      max_tokens: 4096
    code_generator:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 8192
    code_reviewer:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 4096
    test_generator:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 4096
    debugger:
      provider: zhipu
      model: glm-4.5-air
      temperature: 0.1
      max_tokens: 4096
    refactor:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 8192
    game_designer:
      provider: mimo
      model: mimo-v2.5-pro
      temperature: 0.4
      max_tokens: 4096
    scene_generator:
      provider: sensenova
      model: sensenova-6.7-flash-lite
      temperature: 0.3
      max_tokens: 8192

# Agent Configuration
agents:
  orchestrator:
    max_iterations: 10
    timeout: 300
    retry_attempts: 3
  planner:
    max_tasks: 20
    task_granularity: medium
  code_generator:
    supported_engines:
      - godot
    code_style: gdscript
    include_comments: true
  test_generator:
    coverage_target: 80
    test_types:
      - unit
      - integration
  debugger:
    max_fix_attempts: 5
    auto_fix_enabled: true
  refactor:
    quality_threshold: 70
    max_file_size: 1000
    auto_refactor: true

# Vector Database Configuration
vector_db:
  provider: qdrant
  host: localhost
  port: 6333
  collection_name: gameforge_code
  embedding_model: text-embedding-3-small
  dimensions: 1536

# Database Configuration
database:
  url: sqlite:///data/gameforge.db
  echo: false
  pool_size: 5
  max_overflow: 10

# Redis Configuration
redis:
  host: localhost
  port: 6379
  db: 0
  decode_responses: true

# Monitoring Configuration
monitoring:
  prometheus:
    enabled: true
    port: 9090
  logging:
    level: INFO
    format: json
    file: logs/gameforge.log

# Sandbox Configuration
sandbox:
  enabled: true
  timeout: 300
  memory_limit: 512MB
  network_enabled: false
  allowed_paths:
    - ./projects
    - ./temp

# Evaluation Configuration
evaluation:
  test_cases_dir: data/eval_datasets
  metrics:
    - compile_success
    - test_pass_rate
    - code_quality
    - performance
  report_format: html

# Godot Integration
godot:
  editor_path: ${GODOT_EDITOR_PATH:}
  project_path: ${GODOT_PROJECT_PATH:}
  godot_version: ${GODOT_VERSION:4}
  timeout: 300
  auto_refresh: true
  http_port: 8765
  ws_port: 8766
  auto_build_scene: true

# Project Templates
templates:
  godot:
    base_path: templates/godot
    naming_convention: snake_case

# Security Configuration
security:
  api_key_header: X-API-Key
  rate_limit: 60/minute
  max_input_length: 50000
  sandbox_code_execution: true
