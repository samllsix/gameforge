# GameForge Configuration — Godot 版本
# 主配置文件

app:
  name: GameForge
  version: 0.4.0
  description: Godot 游戏研发全流程 AI Agent 工具链
  environment: ${GAMEFORGE_ENV:development}
  debug: ${GAMEFORGE_DEBUG:true}

# Server configuration
server:
  host: 127.0.0.1
  port: 8000
  workers: 4
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

# LLM Configuration - 多Provider架构
# 全量任务已切换到 stepfun step-3.7-flash（2026-09-01，用户指定）：
# planner/code_generator/code_reviewer/test_generator/refactor/scene_generator/
# main_reviewer/game_designer + 默认模型均走 StepFun；
# deepseek provider 保留仅作回退备用
llm:
  default_model: step-3.7-flash
  base_url: https://api.stepfun.com/step_plan/v1
  api_key_env: STEPFUN_API_KEY
  max_retries: 3
  base_retry_delay: 1.0
  max_retry_delay: 30.0
  circuit_breaker_threshold: 5
  circuit_breaker_recovery: 60.0
  cache:
    enabled: true
    ttl: 3600
  providers:
    mimo:
      base_url: https://token-plan-cn.xiaomimimo.com/v1
      api_key_env: MIMO_API_KEY
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
    zhipu:
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
    kimi:
      base_url: https://api.moonshot.cn/v1
      api_key_env: KIMI_API_KEY
    sensenova:
      base_url: https://token.sensenova.cn/v1
      api_key_env: SENSENOVA_API_KEY
    stepfun:
      base_url: https://api.stepfun.com/step_plan/v1
      api_key_env: STEPFUN_API_KEY
  models:
    planner:
      provider: stepfun
      model: step-3.7-flash
      temperature: 0.4
      max_tokens: 4096
    code_generator:
      provider: stepfun
      model: step-3.7-flash
      temperature: 0.2
      max_tokens: 8192
    code_reviewer:
      provider: stepfun
      model: step-3.7-flash
      temperature: 0.2
      max_tokens: 4096
    test_generator:
      provider: stepfun
      model: step-3.7-flash
      temperature: 0.2
      max_tokens: 4096
    debugger:
      provider: zhipu
      model: glm-4.5-air
      temperature: 0.1
      max_tokens: 4096
    refactor:
      provider: stepfun
      model: step-3.7-flash
      temperature: 0.2
      max_tokens: 8192
    game_designer:
      provider: stepfun
      model: step-3.7-flash
      temperature: 0.4
      max_tokens: 8192
    scene_generator:
      provider: stepfun
      model: step-3.7-flash
      temperature: 0.3
      max_tokens: 8192
    main_reviewer:
      provider: stepfun
      model: step-3.7-flash
      temperature: 0.2
      max_tokens: 4096

# Agent Configuration
agents:
  max_concurrent: 5
  planning:
    max_steps: 10
    timeout_seconds: 300
  code_generation:
    max_iterations: 3
    timeout_seconds: 600
  testing:
    max_iterations: 5
    timeout_seconds: 600

# MCP (Model Context Protocol) Configuration
mcp:
  enabled: true
  servers:
    # Image MCP server (stdio) - 美术资源生成
    image:
      transport: stdio
      command: python
      args: ["-m", "src.mcp.servers.image_server"]
      cwd: ${GAMEFORGE_PROJECT_ROOT:.}
      timeout_ms: 30000
      retry:
        max: 3
        backoff: exponential
      env:
        - STEP_API_KEY=${STEP_API_KEY:}
        - STEP_BASE_URL=${STEP_BASE_URL:https://api.stepfun.com/step_plan/v1}
        - SENSENOVA_API_KEY=${SENSENOVA_API_KEY:}
        - SENSENOVA_BASE_URL=${SENSENOVA_BASE_URL:https://token.sensenova.cn/v1}
        - IMAGE_PREFER_PROVIDER=${IMAGE_PREFER_PROVIDER:step}

    # Engine MCP server (stdio) - Godot 引擎操作
    engine:
      transport: stdio
      command: python
      args: ["-m", "src.mcp.servers.engine_server"]
      cwd: ${GAMEFORGE_PROJECT_ROOT:.}
      timeout_ms: 60000
      retry:
        max: 5
        backoff: exponential
      health_check:
        path: "/health"
        interval_ms: 5000

    # Asset MCP server (stdio) - 资源管理
    asset:
      transport: stdio
      command: python
      args: ["-m", "src.mcp.servers.asset_server"]
      cwd: ${GAMEFORGE_PROJECT_ROOT:.}
      timeout_ms: 10000
      audit_log: data/asset_audit.log

    # Knowledge MCP adapter (in-process) - 知识库检索
    knowledge:
      transport: in_process
      module: src.mcp.adapters.knowledge_adapter.KnowledgeMCPAdapter

    # Test MCP adapter (in-process) - 测试管理
    test:
      transport: in_process
      module: src.mcp.adapters.test_adapter.TestMCPAdapter

  client:
    pool_size: 3
    request_timeout_ms: 30000
    circuit_breaker:
      threshold: 5
      recovery_s: 60

# Sandbox Configuration
sandbox:
  enabled: false
  workspace_root: data/sandbox
  memory_limit_mb: 2048
  cpu_time_seconds: 120
  timeout_seconds: 120
  process_limit: 32