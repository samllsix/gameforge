# GameForge Configuration
# Main configuration file for the GameForge platform

app:
  name: GameForge
  version: 0.1.0
  description: 游戏研发全流程AI Agent协作平台
  # 环境和调试模式 — 生产部署时通过环境变量 GAMEFORGE_ENV=production 覆盖
  environment: ${GAMEFORGE_ENV:development}
  debug: ${GAMEFORGE_DEBUG:true}

# Server configuration
server:
  host: 0.0.0.0
  port: 8000
  workers: 4
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

# LLM Configuration - 多Provider架构
llm:
  default_model: mimo-v2.5-pro
  base_url: https://token-plan-cn.xiaomimimo.com/v1
  # 重试配置
  max_retries: 3
  base_retry_delay: 1.0
  max_retry_delay: 30.0
  # 熔断器配置
  circuit_breaker_threshold: 5
  circuit_breaker_recovery: 60.0
  # LLM响应缓存（仅对 temperature=0 的请求生效，Redis不可用时自动禁用）
  cache:
    enabled: true
    ttl: 3600
  # Provider注册表 — 每个provider对应一组 base_url + api_key 环境变量
  providers:
    mimo:
      base_url: https://token-plan-cn.xiaomimimo.com/v1
      api_key_env: MIMO_API_KEY
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
    zhipu:
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
    kimi:
      base_url: https://api.moonshot.cn/v1
      api_key_env: KIMI_API_KEY
  models:
    planner:
      provider: mimo
      model: mimo-v2.5-pro
      temperature: 0.4
      max_tokens: 4096
    code_generator:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 8192
    code_reviewer:
      provider: kimi
      model: kimi-k2.6
      temperature: 1
      max_tokens: 4096
    test_generator:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 4096
    debugger:
      provider: zhipu
      model: glm-4.5-air
      temperature: 0.1
      max_tokens: 4096
    refactor:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 8192
    game_designer:
      provider: mimo
      model: mimo-v2.5-pro
      temperature: 0.4
      max_tokens: 4096
    scene_generator:
      provider: mimo
      model: mimo-v2.5-pro
      temperature: 0.3
      max_tokens: 4096

# Agent Configuration
agents:
  orchestrator:
    max_iterations: 10
    timeout: 300
    retry_attempts: 3
  planner:
    max_tasks: 20
    task_granularity: medium
  code_generator:
    supported_engines:
      - unity
      - unreal
    code_style: standard
    include_comments: true
  test_generator:
    coverage_target: 80
    test_types:
      - unit
      - integration
      - e2e
  debugger:
    max_fix_attempts: 5
    auto_fix_enabled: true
  refactor:
    quality_threshold: 70
    max_file_size: 1000
    auto_refactor: true

# Vector Database Configuration
vector_db:
  provider: qdrant
  host: localhost
  port: 6333
  collection_name: gameforge_code
  embedding_model: text-embedding-3-small
  dimensions: 1536

# Database Configuration
database:
  url: sqlite:///data/gameforge.db
  echo: false
  pool_size: 5
  max_overflow: 10

# Redis Configuration
redis:
  host: localhost
  port: 6379
  db: 0
  decode_responses: true

# Monitoring Configuration
monitoring:
  prometheus:
    enabled: true
    port: 9090
  logging:
    level: INFO
    format: json
    file: logs/gameforge.log

# Sandbox Configuration
sandbox:
  enabled: true
  timeout: 300
  memory_limit: 512MB
  network_enabled: false
  allowed_paths:
    - ./projects
    - ./temp

# Evaluation Configuration
evaluation:
  test_cases_dir: data/eval_datasets
  metrics:
    - compile_success
    - test_pass_rate
    - code_quality
    - performance
  report_format: html

# Unity Integration
unity:
  editor_path: ${UNITY_EDITOR_PATH:}
  project_path: ${UNITY_PROJECT_PATH:}
  timeout: 300
  auto_refresh: true
  http_port: 8765
  auto_build_scene: true

# Project Templates
templates:
  unity:
    base_path: templates/unity
    naming_convention: PascalCase
  unreal:
    base_path: templates/unreal
    naming_convention: PascalCase

# Security Configuration
security:
  api_key_header: X-API-Key
  rate_limit: 60/minute
  max_input_length: 50000
  sandbox_code_execution: true
