# GameForge Configuration — Godot 版本
# 主配置文件

app:
  name: GameForge
  version: 0.4.0
  description: Godot 游戏研发全流程 AI Agent 工具链
  environment: ${GAMEFORGE_ENV:development}
  debug: ${GAMEFORGE_DEBUG:true}

# Server configuration
server:
  host: 127.0.0.1
  port: 8000
  workers: 4
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

# LLM Configuration - 多Provider架构
llm:
  default_model: mimo-v2.5-pro
  base_url: https://token-plan-cn.xiaomimimo.com/v1
  max_retries: 3
  base_retry_delay: 1.0
  max_retry_delay: 30.0
  circuit_breaker_threshold: 5
  circuit_breaker_recovery: 60.0
  cache:
    enabled: true
    ttl: 3600
  providers:
    mimo:
      base_url: https://token-plan-cn.xiaomimimo.com/v1
      api_key_env: MIMO_API_KEY
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
    zhipu:
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
    kimi:
      base_url: https://api.moonshot.cn/v1
      api_key_env: KIMI_API_KEY
    sensenova:
      base_url: https://token.sensenova.cn/v1
      api_key_env: SENSENOVA_API_KEY
  models:
    planner:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.4
      max_tokens: 4096
    code_generator:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 8192
    code_reviewer:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 4096
    test_generator:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 4096
    debugger:
      provider: zhipu
      model: glm-4.5-air
      temperature: 0.1
      max_tokens: 4096
    refactor:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 8192
    game_designer:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.4
      max_tokens: 4096
    scene_generator:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.3
      max_tokens: 8192
    main_reviewer:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.2
      max_tokens: 4096

# Agent Configuration
agents:
  orchestrator:
    max_iterations: 10
    timeout: 300
    retry_attempts: 3
  planner:
    max_tasks: 20
    task_granularity: medium
  code_generator:
    supported_engines:
      - godot
    code_style: gdscript
    include_comments: true
  main_reviewer:
    enabled: true
    review_rounds: 2
    check_game_design: true
  test_generator:
    coverage_target: 80
    test_types:
      - unit
      - integration
  debugger:
    max_fix_attempts: 5
    auto_fix_enabled: true
  refactor:
    quality_threshold: 70
    max_file_size: 1000
    auto_refactor: true
  # 多智能体改造第一步：审查↔重构对话协商。默认关闭，保持原流水线行为。
  # 设为 true 后，code_reviewer 与 refactor 将通过 DialogueSession 多轮协商。
  # 需同时关闭 code_reviewer/refactor 的 fast_review/fast_refactor 才能看到真实 LLM 协商。
  review_refactor:
    dialogue_enabled: true
    max_rounds: 3
  # 多智能体改造第二步：反思回环。默认关闭。
  # 开启后，main_reviewer 之后插入 reflector，若判定需重规划则回到 planner。
  reflector:
    enabled: true
    fast_reflect: false      # true=启发式(离线可用)；false=调用 LLM 做复盘
    max_reflections: 1       # 最大重规划次数，防止无限回环
  # 多智能体改造第四步：debugger 动态委派查知识库（默认开启）。
  debugger_delegation:
    enabled: true
  # 多智能体改造第五步：tester 读取 Godot 真实引擎反馈（默认开启，Godot 未运行时降级）。
  tester_engine_feedback:
    enabled: true

# Vector Database Configuration
vector_db:
  provider: qdrant
  host: localhost
  port: 6333
  collection_name: gameforge_code
  embedding_model: text-embedding-3-small
  dimensions: 1536

# Database Configuration
database:
  url: sqlite:///data/gameforge.db
  echo: false
  pool_size: 5
  max_overflow: 10

# Redis Configuration
redis:
  host: localhost
  port: 6379
  db: 0
  decode_responses: true

# Monitoring Configuration
monitoring:
  prometheus:
    enabled: true
    port: 9090
  logging:
    level: INFO
    format: json
    file: logs/gameforge.log

# Sandbox Configuration
sandbox:
  # Host-process execution is not a sandbox. Keep disabled until an isolated
  # container or VM backend is available.
  enabled: false
  timeout: 300
  memory_limit: 512MB
  network_enabled: false
  allowed_paths:
    - ./projects
    - ./temp

# Evaluation Configuration
evaluation:
  test_cases_dir: data/eval_datasets
  metrics:
    - compile_success
    - test_pass_rate
    - code_quality
    - performance
  report_format: html

# Godot Integration
godot:
  editor_path: ${GODOT_EDITOR_PATH:}
  project_path: ${GODOT_PROJECT_PATH:}
  godot_version: ${GODOT_VERSION:4}
  timeout: 300
  auto_refresh: true
  http_port: 8765
  ws_port: 8766
  auto_build_scene: true
  # 编译/校验闭环模式：
  #   auto     - 配置了 Godot 引擎路径时走 headless（无需编辑器 GUI），否则退回 8765 HTTP
  #   headless - 始终走 headless（未配置引擎路径则报错，不退回）
  #   http     - 始终走 8765 编辑器插件（需打开 Godot 编辑器并启用插件）
  compile_mode: auto

# Project Templates
templates:
  godot:
    base_path: templates/godot
    naming_convention: snake_case

# Security Configuration
security:
  api_key_header: X-API-Key
  rate_limit: 60/minute
  max_input_length: 50000
  sandbox_code_execution: false
