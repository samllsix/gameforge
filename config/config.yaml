app:
  name: GameForge
  version: 0.4.0
  description: Godot 游戏研发全流程 AI Agent 工具链
  environment: ${GAMEFORGE_ENV:development}
  debug: ${GAMEFORGE_DEBUG:true}
server:
  host: 127.0.0.1
  port: 8000
  workers: 4
  cors_origins:
  - http://localhost:3000
  - http://localhost:5173
llm:
  default_model: step-5-preview
  base_url: https://api.stepfun.com/step_plan/v1
  api_key_env: STEPFUN_API_KEY
  max_retries: 3
  base_retry_delay: 1.0
  max_retry_delay: 30.0
  circuit_breaker_threshold: 5
  circuit_breaker_recovery: 60.0
  cache:
    enabled: true
    ttl: 3600
  providers:
    mimo:
      base_url: https://token-plan-cn.xiaomimimo.com/v1
      api_key_env: MIMO_API_KEY
    deepseek:
      base_url: https://token.sensenova.cn/v1
      api_key_env: DEEPSEEK_API_KEY
    zhipu:
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
    kimi:
      base_url: https://api.moonshot.cn/v1
      api_key_env: KIMI_API_KEY
    sensenova:
      base_url: https://token.sensenova.cn/v1
      api_key_env: SENSENOVA_API_KEY
    stepfun:
      base_url: https://api.stepfun.com/step_plan/v1
      api_key_env: STEPFUN_API_KEY
  # 2026-09-24 起全部 Agent 切到 stepfun/step-5-preview（原 sensenova/deepseek-v4-pro，回滚见 /tmp/config.yaml.bak 或 git diff）
  models:
    planner:
      provider: stepfun
      model: step-5-preview
      temperature: 0.4
      max_tokens: 16384
    code_generator:
      provider: stepfun
      model: step-5-preview
      temperature: 0.2
      max_tokens: 16384
    code_reviewer:
      provider: stepfun
      model: step-5-preview
      temperature: 0.2
      max_tokens: 16384
    test_generator:
      provider: stepfun
      model: step-5-preview
      temperature: 0.2
      max_tokens: 4096
    debugger:
      provider: stepfun
      model: step-5-preview
      temperature: 0.1
      max_tokens: 4096
    refactor:
      provider: stepfun
      model: step-5-preview
      temperature: 0.2
      max_tokens: 8192
    game_designer:
      provider: stepfun
      model: step-5-preview
      temperature: 0.4
      max_tokens: 16384
    scene_generator:
      provider: stepfun
      model: step-5-preview
      temperature: 0.3
      max_tokens: 8192
    main_reviewer:
      provider: stepfun
      model: step-5-preview
      temperature: 0.2
      max_tokens: 16384
    requirement_analyzer:
      provider: stepfun
      model: step-5-preview
      temperature: 0.4
      max_tokens: 16384
    orchestrator:
      provider: stepfun
      model: step-5-preview
      temperature: 0.4
      max_tokens: 4096
    reflector:
      provider: stepfun
      model: step-5-preview
      temperature: 0.4
      max_tokens: 4096
agents:
  max_concurrent: 5
  planning:
    max_steps: 10
    timeout_seconds: 300
  code_generation:
    max_iterations: 3
    timeout_seconds: 600
  testing:
    max_iterations: 5
    timeout_seconds: 600
  ui_generation:
    scene_dir: res://scenes/ui
    script_dir: res://scripts/ui
    max_concurrent_ui: 5
    timeout_seconds: 300
  audio_generation:
    audio_dir: res://assets/audio
    max_concurrent_audio: 3
    timeout_seconds: 300
audio:
  default_tts_provider: stepfun
  providers:
    stepfun:
      base_url: https://api.stepfun.com/step_plan/v1
      api_key_env: STEPFUN_TTS_API_KEY
      model: stepaudio-2.5-tts
      voice: zh-CN-YunxiNeural
      response_format: mp3
      endpoint: /audio/speech
mcp:
  enabled: true
  servers:
    image:
      transport: stdio
      command: python
      args:
      - -m
      - src.mcp.servers.image_server
      cwd: ${GAMEFORGE_PROJECT_ROOT:.}
      timeout_ms: 30000
      retry:
        max: 3
        backoff: exponential
      env:
      - STEP_API_KEY=${STEP_API_KEY:}
      - STEP_BASE_URL=${STEP_BASE_URL:https://api.stepfun.com/step_plan/v1}
      - SENSENOVA_API_KEY=${SENSENOVA_API_KEY:}
      - SENSENOVA_BASE_URL=${SENSENOVA_BASE_URL:https://token.sensenova.cn/v1}
      - IMAGE_PREFER_PROVIDER=${IMAGE_PREFER_PROVIDER:step}
    engine:
      transport: stdio
      command: python
      args:
      - -m
      - src.mcp.servers.engine_server
      cwd: ${GAMEFORGE_PROJECT_ROOT:.}
      timeout_ms: 60000
      retry:
        max: 5
        backoff: exponential
      health_check:
        path: /health
        interval_ms: 5000
    asset:
      transport: stdio
      command: python
      args:
      - -m
      - src.mcp.servers.asset_server
      cwd: ${GAMEFORGE_PROJECT_ROOT:.}
      timeout_ms: 10000
      audit_log: data/asset_audit.log
    knowledge:
      transport: in_process
      module: src.mcp.adapters.knowledge_adapter.KnowledgeMCPAdapter
    test:
      transport: in_process
      module: src.mcp.adapters.test_adapter.TestMCPAdapter
  client:
    pool_size: 3
    request_timeout_ms: 30000
    circuit_breaker:
      threshold: 5
      recovery_s: 60
sandbox:
  enabled: false
  workspace_root: data/sandbox
  memory_limit_mb: 2048
  cpu_time_seconds: 120
  timeout_seconds: 120
  process_limit: 32
  auto_merge: true
  auto_rollback: true
  backend: local
  cleanup_threshold: 20
  cleanup_keep_last: 10
  cleanup_max_age_hours: 168
  docker:
    image: gameforge/sandbox-runner:latest
    network: false
    mem_limit: 2g
    cpu_quota: 100000
    pids_limit: 32

# LLM stub 模式：所有 LLM 调用立即拒绝，Agent 走模板降级，
# 全链路离线冒烟用（也可用环境变量 GAMEFORGE_LLM_STUB=1 开启，优先级更高）
# llm:
#   stub:
#     enabled: true

# Playtest：真正玩游戏——声明式输入回放 + 进程内抓帧 + report.json 证据
# （验收原则："编译通过 ≠ 可玩"；产物落在 projects/<pid>/.gameforge/<run_id>/playtest/）
playtest:
  enabled: false
  frames_every: 10        # 每 N 帧抓一帧
  duration_tail: 1.0      # 最后一个动作之后再跑多少秒
  timeout_seconds: 90
  max_fix_attempts: 1     # 未通过时喂给 debugger 修复并重放的最大额外轮数
  # actions: []            # 自定义动作脚本；缺省用内置通用计划（左右移动+跳跃+交互）

# VLM 视觉审查：playtest 帧交给多模态模型按失败模式清单打分
# （黑屏/精灵错位/UI 不可读/风格不符/相机异常；高严重度问题触发修复循环）
visual_review:
  enabled: false
  max_frames: 4           # 送审帧数（均匀采样）

