# ═══════════════════════════════════════════════════════
#  GameForge — Docker Compose (Production Overlay)
# ═══════════════════════════════════════════════════════
#
#  启动方式：
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  前置要求：
#    - .env 文件中设置 GAMEFORGE_API_KEYS
#    - .env 文件中设置 GAMEFORGE_CORS_ORIGINS
# ═══════════════════════════════════════════════════════

services:
  app:
    environment:
      - GAMEFORGE_ENV=production
      - GAMEFORGE_DEBUG=false
      - GAMEFORGE_PORT=8000
      - GAMEFORGE_API_KEYS=${GAMEFORGE_API_KEYS:?请在 .env 中设置 GAMEFORGE_API_KEYS}
      - GAMEFORGE_CORS_ORIGINS=${GAMEFORGE_CORS_ORIGINS:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://gameforge:gameforge@postgres:5432/gameforge}
    # 生产环境不挂载源码（使用镜像内代码）
    volumes: !override
      - gameforge-data:/app/data
      - gameforge-logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: always
