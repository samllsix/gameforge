<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameForge Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e17; display: flex; flex-direction: column; align-items: center; height: 100vh; font-family: 'Inter', sans-serif; color: #e8edf5; overflow: hidden; }
        #bar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; width: 100%; background: rgba(15,22,41,0.95); border-bottom: 1px solid rgba(56,72,110,0.3); }
        #bar h1 { font-size: 16px; font-weight: 800; background: linear-gradient(135deg,#6c8cff,#a78bfa,#f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #bar .info { font-size: 12px; color: #7b8ba8; }
        #bar .stats { margin-left: auto; display: flex; gap: 16px; font-size: 13px; font-weight: 600; }
        .stat { display: flex; align-items: center; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        canvas { flex: 1; width: 100%; }
        #footer { padding: 8px; text-align: center; font-size: 11px; color: #7b8ba8; background: rgba(15,22,41,0.95); width: 100%; }
        kbd { background: rgba(108,140,255,0.12); border: 1px solid rgba(108,140,255,0.25); border-radius: 3px; padding: 0 4px; font-family: monospace; font-size: 11px; color: #8aabff; }
    </style>
</head>
<body>
    <div id="bar">
        <h1>🎮 GameForge Demo</h1>
        <span class="info" id="sceneName">Loading...</span>
        <div class="stats">
            <span class="stat"><span class="dot" style="background:#6c8cff"></span> Score: <b id="score">0</b></span>
            <span class="stat"><span class="dot" style="background:#f87171"></span> Lives: <b id="lives">3</b></span>
            <span class="stat" id="statusText"><span class="dot" style="background:#34d399"></span> Running</span>
        </div>
    </div>
    <canvas id="c"></canvas>
    <div id="footer">
        <kbd>A</kbd><kbd>D</kbd> Move &nbsp;|&nbsp; <kbd>Space</kbd> Jump &nbsp;|&nbsp; <kbd>R</kbd> Reset
    </div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 80;
}
resize();
window.addEventListener('resize', resize);

const W = () => canvas.width;
const H = () => canvas.height;

// Load scene
const DEFAULT = {"scene_name":"GameScene","camera":{"position":[0,1,-10],"orthographic":true,"orthographic_size":6,"background_color":[0.4,0.7,1,1]},"game_objects":[
    {"name":"Player","type":"Capsule","position":[0,1,0],"tag":"Player","color":[0.42,0.55,1,1],"scale":[0.8,1,0.8],"components":[{"type":"Rigidbody2D","properties":{"gravityScale":"2"}},{"type":"BoxCollider2D","properties":{"size":"[0.8,0.9]"}},{"type":"PlayerController","properties":{"moveSpeed":"5","jumpForce":"10"}}]},
    {"name":"Ground","type":"Cube","position":[0,-2,0],"is_static":true,"color":[0.2,0.83,0.6,1],"scale":[14,0.5,1],"components":[{"type":"BoxCollider2D","properties":{"size":"[14,1]"}}]},
    {"name":"Plat1","type":"Cube","position":[-3,0,0],"is_static":true,"color":[0.3,0.69,0.49,1],"scale":[3,0.5,1],"components":[{"type":"BoxCollider2D","properties":{"size":"[3,0.5]"}}]},
    {"name":"Plat2","type":"Cube","position":[3,1,0],"is_static":true,"color":[0.3,0.69,0.49,1],"scale":[3,0.5,1],"components":[{"type":"BoxCollider2D","properties":{"size":"[3,0.5]"}}]},
    {"name":"Coin1","type":"Sphere","position":[-3,1,0],"color":[0.98,0.75,0.14,1],"scale":[0.5,0.5,0.5],"components":[{"type":"BoxCollider2D","properties":{"size":"[0.5,0.5]","isTrigger":"true"}}]},
    {"name":"Coin2","type":"Sphere","position":[3,2,0],"color":[0.98,0.75,0.14,1],"scale":[0.5,0.5,0.5],"components":[{"type":"BoxCollider2D","properties":{"size":"[0.5,0.5]","isTrigger":"true"}}]},
    {"name":"Enemy1","type":"Cube","position":[2,-1,0],"color":[0.97,0.44,0.44,1],"scale":[0.8,0.8,0.8],"components":[{"type":"Rigidbody2D","properties":{"gravityScale":"3"}},{"type":"BoxCollider2D","properties":{"size":"[0.8,0.8]"}},{"type":"EnemyController","properties":{"moveSpeed":"2","patrolDistance":"3"}}]}
]};

async function loadScene() {
    try {
        const s = sessionStorage.getItem('gameforge_demo_scene');
        if (s) return JSON.parse(s);
    } catch(e) {}
    try {
        const resp = await fetch('/api/v1/history?limit=1');
        const data = await resp.json();
        if (data.history && data.history.length > 0) {
            const sd = data.history[0].scene_description;
            if (sd && sd.game_objects && sd.game_objects.length > 0) return sd;
        }
    } catch(e) {}
    return DEFAULT;
}

(async function start() {
    const scene = await loadScene();
    document.getElementById('sceneName').textContent = scene.scene_name || 'GameScene';

const cam = scene.camera || {position:[0,0,-10],orthographic_size:6,background_color:[0.4,0.7,1,1]};
const camSize = cam.orthographic_size || 6;
const camX = cam.position[0]||0, camY = cam.position[1]||1;

function unit() { return H() / (camSize * 2); }
function w2s(wx,wy) { const u=unit(); return [W()/2+(wx-camX)*u, H()/2-(wy-camY)*u]; }
function rgba(c) { return `rgba(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0},${c[3]||1})`; }

const objs = scene.game_objects||[];
const pObj = objs.find(o=>o.tag==='Player')||objs.find(o=>o.name==='Player');
const eObjs = objs.filter(o=>o.components?.some(c=>c.type==='EnemyController'));
const cObjs = objs.filter(o=>o.components?.some(c=>c.properties?.isTrigger==='true')&&o.type==='Sphere');
const sObjs = objs.filter(o=>o.is_static);

const GRAVITY=-20, dt=1/60;
const ps = pObj?.scale||[0.8,1,0.8];
let P = {x:pObj?.position[0]||0, y:pObj?.position[1]||1, vx:0, vy:0, w:ps[0], h:ps[1], ground:false, score:0, lives:3, dead:false, t:0};
let enemies = eObjs.map(o=>({x:o.position[0],y:o.position[1],vx:1.5,w:(o.scale||[0.8])[0],h:(o.scale||[0.8,0.8])[1],ox:o.position[0],range:3,color:o.color||[0.97,0.44,0.44,1]}));
let coins = cObjs.map((o,i)=>({x:o.position[0],y:o.position[1],r:(o.scale||[0.5])[0]/2,got:false,ph:i*Math.PI,color:o.color||[0.98,0.75,0.14,1]}));
const statics = sObjs.map(o=>{const bc=o.components?.find(c=>c.type==='BoxCollider2D');if(!bc)return null;const sz=(bc.properties.size||'[1,1]').replace(/[\[\]]/g,'',).split(',');return{x:o.position[0],y:o.position[1],w:parseFloat(sz[0]),h:parseFloat(sz[1]),color:o.color};}).filter(Boolean);

const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});
document.addEventListener('keyup',e=>keys[e.code]=false);

function hit(ax,ay,aw,ah,bx,by,bw,bh){return ax-aw/2<bx+bw/2&&ax+aw/2>bx-bw/2&&ay-ah/2<by+bh/2&&ay+ah/2>by-bh/2;}

function collide(px,py,pw,ph){
    for(const s of statics){
        if(!hit(px,py,pw,ph,s.x,s.y,s.w,s.h))continue;
        const ox=(pw/2+s.w/2)-Math.abs(px-s.x), oy=(ph/2+s.h/2)-Math.abs(py-s.y);
        if(ox<oy){px+=(px<s.x?-ox:ox);P.vx=0;}else{py+=(py<s.y?-oy:oy);P.vy=0;P.ground=true;}
    }
    return[px,py];
}

function reset(){P.x=pObj?.position[0]||0;P.y=pObj?.position[1]||1;P.vx=0;P.vy=0;P.score=0;P.lives=3;P.dead=false;enemies.forEach(e=>{e.x=e.ox;e.vx=1.5;});coins.forEach(c=>c.got=false);document.getElementById('score').textContent='0';document.getElementById('lives').textContent='3';document.getElementById('statusText').innerHTML='<span class="dot" style="background:#34d399"></span> Running';}

function update(){
    if(P.dead){P.t-=dt;if(P.t<=0){P.dead=false;P.x=pObj?.position[0]||0;P.y=pObj?.position[1]||1;P.vx=0;P.vy=0;}return;}
    P.vx=0;if(keys.ArrowLeft||keys.KeyA)P.vx=-5;if(keys.ArrowRight||keys.KeyD)P.vx=5;
    if((keys.Space||keys.ArrowUp||keys.KeyW)&&P.ground){P.vy=10;P.ground=false;}
    P.vy+=GRAVITY*dt*2;P.x+=P.vx*dt;P.y+=P.vy*dt;P.ground=false;
    [P.x,P.y]=collide(P.x,P.y,P.w,P.h);
    for(const e of enemies){e.x+=e.vx*dt;if(Math.abs(e.x-e.ox)>e.range)e.vx*=-1;
        if(hit(P.x,P.y,P.w,P.h,e.x,e.y,e.w,e.h)){P.lives--;document.getElementById('lives').textContent=P.lives;if(P.lives<=0){P.dead=true;document.getElementById('statusText').innerHTML='<span class="dot" style="background:#f87171"></span> Game Over';}else{P.dead=true;P.t=1;}}}
    for(const c of coins){if(c.got)continue;c.ph+=dt*3;const dy=Math.sin(c.ph)*0.1;if(Math.hypot(P.x-c.x,P.y-(c.y+dy))<c.r+0.4){c.got=true;P.score+=10;document.getElementById('score').textContent=P.score;}}
    if(keys.KeyR)reset();
}

function draw(){
    const w=W(),h=H();
    ctx.fillStyle=rgba(cam.background_color||[0.4,0.7,1,1]);ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;
    const u=unit();
    for(let x=w/2-camX*u%x;x<w;x+=u){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=h/2+camY*u%y;y<h;y+=u){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

    for(const s of statics){const[sx,sy]=w2s(s.x,s.y);const sw=s.w*u,sh=s.h*u;ctx.fillStyle=rgba(s.color||[0.2,0.83,0.6,1]);ctx.fillRect(sx-sw/2,sy-sh/2,sw,sh);ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.strokeRect(sx-sw/2,sy-sh/2,sw,sh);}

    for(const c of coins){if(c.got)continue;const dy=Math.sin(c.ph)*0.1;const[sx,sy]=w2s(c.x,c.y+dy);const sr=c.r*u;const g=ctx.createRadialGradient(sx,sy,0,sx,sy,sr*2);g.addColorStop(0,'rgba(251,191,36,0.3)');g.addColorStop(1,'rgba(251,191,36,0)');ctx.fillStyle=g;ctx.fillRect(sx-sr*2,sy-sr*2,sr*4,sr*4);ctx.fillStyle=rgba(c.color);ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(sx-sr*0.3,sy-sr*0.3,sr*0.3,0,Math.PI*2);ctx.fill();}

    for(const e of enemies){const[sx,sy]=w2s(e.x,e.y);const sw=e.w*u,sh=e.h*u;ctx.fillStyle=rgba(e.color);ctx.fillRect(sx-sw/2,sy-sh/2,sw,sh);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx-sw*0.15,sy-sh*0.1,sw*0.12,0,Math.PI*2);ctx.arc(sx+sw*0.15,sy-sh*0.1,sw*0.12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sx-sw*0.12,sy-sh*0.08,sw*0.06,0,Math.PI*2);ctx.arc(sx+sw*0.18,sy-sh*0.08,sw*0.06,0,Math.PI*2);ctx.fill();}

    if(!P.dead||Math.sin(Date.now()/50)>0){const[sx,sy]=w2s(P.x,P.y);const sw=P.w*u,sh=P.h*u;ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.ellipse(sx,sy+sh/2+3,sw*0.4,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=rgba(pObj?.color||[0.42,0.55,1,1]);const r=sw/2;ctx.beginPath();ctx.arc(sx,sy-sh/2+r,r,Math.PI,0);ctx.lineTo(sx+r,sy+sh/2-r);ctx.arc(sx,sy+sh/2-r,r,0,Math.PI);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx-sw*0.15,sy-sh*0.1,sw*0.1,0,Math.PI*2);ctx.arc(sx+sw*0.15,sy-sh*0.1,sw*0.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(sx-sw*0.12,sy-sh*0.08,sw*0.05,0,Math.PI*2);ctx.arc(sx+sw*0.18,sy-sh*0.08,sw*0.05,0,Math.PI*2);ctx.fill();}

    if(Math.abs(P.vx)>0&&P.ground){for(let i=0;i<3;i++){const px=P.x-P.vx*0.02+(Math.random()-0.5)*0.3;const[spx,spy]=w2s(px,P.y-0.4);ctx.fillStyle=`rgba(108,140,255,${0.3*Math.random()})`;ctx.beginPath();ctx.arc(spx,spy,2+Math.random()*3,0,Math.PI*2);ctx.fill();}}
}

function loop(){update();draw();requestAnimationFrame(loop);}
    loop();
})();
</script>
</body>
</html>
