<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameForge - AI游戏开发平台</title>
    <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>GameForge</h1>
            <span class="subtitle">AI游戏研发全流程协作平台</span>
            <div class="header-actions">
                <select id="engine" class="header-select">
                    <option value="unity">Unity</option>
                    <option value="unreal">Unreal</option>
                    <option value="godot">Godot</option>
                </select>
                <input type="text" id="projectName" class="header-input" value="GameForge Project" placeholder="项目名称">
                <button class="btn-icon" id="historyBtn" title="历史记录">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <div class="welcome-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h2>欢迎使用 GameForge</h2>
                <p>描述你想要的游戏，AI将自动为你生成完整的游戏代码。</p>
                <div class="welcome-examples">
                    <button class="example-btn">创建一个2D平台跳跃游戏，玩家可以左右移动和跳跃，有计分系统</button>
                    <button class="example-btn">制作一个太空射击游戏，有敌人、子弹和爆炸效果</button>
                    <button class="example-btn">开发一个RPG战斗系统，包含角色、技能和回合制战斗</button>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea id="requirements" placeholder="描述你想要的游戏..." rows="1"></textarea>
                <button id="submitBtn" class="send-btn" title="发送 (Enter)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
            <div class="input-hint">Enter 发送，Shift+Enter 换行</div>
        </div>
    </main>

    <!-- 历史记录模态框 -->
    <div class="modal-overlay" id="historyModal" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3>历史记录</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="historyList">
                <p class="empty-state">暂无历史记录</p>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=6"></script>
</body>
</html>
