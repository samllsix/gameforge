<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GameForge - AI游戏开发平台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e17'/%3E%3Cpath d='M16 5 6 10l10 5 10-5-10-5Zm-8 11 8 4 8-4v5l-8 4-8-4v-5Z' fill='%236c8cff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/style.css?v=13">
    <link rel="preload" href="/static/lib/highlight.min.js" as="script">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-brand">
                <h1>GameForge</h1>
                <span class="subtitle">AI游戏研发全流程协作平台</span>
            </div>
            <div class="header-actions">
                <select id="engine" class="header-select" aria-label="游戏引擎">
                    <option value="godot">Godot</option>
                </select>
                <input type="text" id="projectName" class="header-input" value="GameForge Project" placeholder="项目名称" aria-label="项目名称">
                <button class="btn-icon" id="historyBtn" title="历史记录" aria-label="历史记录">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                </button>
                <button class="btn-icon" id="settingsBtn" title="设置" aria-label="设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                </button>
                <button class="btn-icon panel-toggle" id="panelToggle" title="工程视图" aria-label="工程视图" aria-expanded="false" aria-controls="engineeringPanel">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <main class="chat-container">
            <div class="chat-messages" id="chatMessages" role="log" aria-live="polite">
                <div class="welcome-message">
                    <div class="welcome-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <h2>欢迎使用 GameForge</h2>
                    <p>描述你想要的游戏，AI将自动为你生成完整的游戏代码。</p>
                    <div class="welcome-examples">
                        <button class="example-btn">创建一个2D平台跳跃游戏，玩家可以左右移动和跳跃，有计分系统</button>
                        <button class="example-btn">制作一个太空射击游戏，有敌人、子弹和爆炸效果</button>
                        <button class="example-btn">开发一个RPG战斗系统，包含角色、技能和回合制战斗</button>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea id="requirements" placeholder="描述你想要的游戏..." rows="1" aria-label="游戏需求描述"></textarea>
                    <div class="input-actions">
                        <button id="stopBtn" class="stop-btn hidden" title="停止生成" aria-label="停止生成">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                        </button>
                        <button id="submitBtn" class="send-btn" title="发送 (Enter)" aria-label="发送">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="input-toolbar">
                    <span class="input-hint">Enter 发送，Shift+Enter 换行</span>
                    <div class="toolbar-actions">
                        <button class="toolbar-btn" id="clearBtn" title="清空对话" aria-label="清空对话">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                            <span>清空</span>
                        </button>
                        <button class="toolbar-btn" id="downloadBtn" title="下载文件" aria-label="下载文件">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            <span>下载</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <div class="panel-backdrop" id="panelBackdrop"></div>

        <aside class="engineering-panel" id="engineeringPanel" role="complementary" aria-label="工程视图">
            <div class="panel-header">
                <h3>工程视图</h3>
            </div>

            <!-- 阶段时间线 -->
            <div class="panel-section">
                <h4>生成进度</h4>
                <div class="phase-timeline" id="phaseTimeline">
                    <div class="timeline-item pending" data-phase="designing">
                        <div class="timeline-dot"></div>
                        <div class="timeline-label">游戏设计</div>
                    </div>
                    <div class="timeline-item pending" data-phase="planning">
                        <div class="timeline-dot"></div>
                        <div class="timeline-label">任务规划</div>
                    </div>
                    <div class="timeline-item pending" data-phase="generating">
                        <div class="timeline-dot"></div>
                        <div class="timeline-label">代码生成</div>
                    </div>
                    <div class="timeline-item pending" data-phase="reviewing">
                        <div class="timeline-dot"></div>
                        <div class="timeline-label">代码审查</div>
                    </div>
                    <div class="timeline-item pending" data-phase="testing">
                        <div class="timeline-dot"></div>
                        <div class="timeline-label">测试生成</div>
                    </div>
                    <div class="timeline-item pending" data-phase="scene">
                        <div class="timeline-dot"></div>
                        <div class="timeline-label">场景构建</div>
                    </div>
                    <div class="timeline-item pending" data-phase="complete">
                        <div class="timeline-dot"></div>
                        <div class="timeline-label">完成</div>
                    </div>
                </div>
            </div>

            <!-- 文件树 -->
            <div class="panel-section">
                <h4>生成文件</h4>
                <div class="file-tree" id="fileTree">
                    <p class="empty-state">等待生成...</p>
                </div>
            </div>

            <!-- 代码预览 -->
            <div class="panel-section code-preview-section">
                <h4>代码预览</h4>
                <div class="code-preview" id="codePreview">
                    <pre><code id="previewCode">// 选择文件查看代码</code></pre>
                </div>
            </div>

            <!-- 场景信息 -->
            <div class="panel-section">
                <h4>场景信息</h4>
                <div class="scene-info-panel" id="sceneInfoPanel">
                    <p class="empty-state">等待场景生成...</p>
                </div>
            </div>

            <!-- 日志 -->
            <div class="panel-section">
                <h4>生成日志</h4>
                <div class="log-list" id="logList">
                    <p class="empty-state">暂无日志</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- 历史记录模态框 -->
    <div class="modal-overlay" id="historyModal" style="display:none" role="dialog" aria-label="历史记录" aria-modal="true">
        <div class="modal">
            <div class="modal-header">
                <h3>历史记录</h3>
                <button class="modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body" id="historyList">
                <p class="empty-state">暂无历史记录</p>
            </div>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div class="modal-overlay" id="settingsModal" style="display:none" role="dialog" aria-label="设置" aria-modal="true">
        <div class="modal">
            <div class="modal-header">
                <h3>设置</h3>
                <button class="modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="apiKeyInput" class="setting-label">API Key</label>
                    <p class="setting-desc">如服务器启用了 API Key 认证，请在此输入。保存在当前会话中。</p>
                    <div class="setting-input-row">
                        <input type="password" id="apiKeyInput" class="setting-input" placeholder="输入 API Key...">
                        <button class="btn-sm" id="apiKeyToggle" title="显示/隐藏" aria-label="显示或隐藏 API Key">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="setting-actions">
                        <button class="btn-sm btn-primary" id="apiKeySave">保存</button>
                        <button class="btn-sm" id="apiKeyClear">清除</button>
                    </div>
                    <div class="setting-status" id="apiKeyStatus"></div>
                </div>
            </div>
        </div>
    </div>

    <script defer src="/static/app.js?v=13"></script>
</body>
</html>
