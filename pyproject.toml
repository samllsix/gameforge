[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gameforge"
version = "0.1.0"
description = "GameForge — 游戏研发全流程AI Agent协作平台"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
    { name = "GameForge Team" },
]
keywords = ["game-development", "ai-agent", "multi-agent", "langgraph", "autogen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "autogen-agentchat>=0.4.0",
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.5.0",
    "pre-commit>=3.8.0",
    "mypy>=1.10.0",
]
unity = [
    "unitypy>=1.10.0",
]
full = [
    "qdrant-client>=1.12.0",
    "chromadb>=0.5.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "celery>=5.4.0",
    "prometheus-client>=0.20.0",
    "langsmith>=0.1.0",
    "tree-sitter>=0.22.0",
    "pylint>=3.0.0",
    "flake8>=7.0.0",
    "alembic>=1.13.0",
    "aiohttp>=3.10.0",
    "pyautogen>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/gameforge/gameforge"
Documentation = "https://gameforge.readthedocs.io"
Repository = "https://github.com/gameforge/gameforge"
Issues = "https://github.com/gameforge/gameforge/issues"

[project.scripts]
gameforge = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short -p no:cacheprovider"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except Exception",
]
